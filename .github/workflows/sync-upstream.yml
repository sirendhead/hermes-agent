name: Sync upstream (Hermes Agent)

# Keeps `main` as a pristine mirror of NousResearch/Hermes-Agent@main, then
# merges those changes up into the `color-hermes` overlay branch (which carries
# this fork's own commits, including this workflow). If the overlay merge
# conflicts, the run opens a single tracking issue instead of force-pushing.
# Pattern copied from color-llm's sync-upstream.yml.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours — upstream is very active
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/NousResearch/Hermes-Agent.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "hermes-sync-bot"
          git config user.email "actions@github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null \
            || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream main --no-tags

      - name: Fast-forward main to upstream/main
        run: |
          git checkout -B main origin/main
          git merge --ff-only upstream/main
          git push origin main

      - name: Merge main into color-hermes overlay
        id: overlay
        run: |
          git checkout -B color-hermes origin/color-hermes
          set +e
          git merge --no-edit main
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          else
            git push origin color-hermes
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open tracking issue on conflict
        if: steps.overlay.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const label = 'upstream-sync';
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label,
            });
            if (existing.data.length > 0) {
              core.info('Tracking issue already open, skipping.');
              return;
            }
            await github.rest.issues.create({
              owner, repo,
              title: 'Upstream sync: merge conflict into `color-hermes` overlay',
              labels: [label],
              body: [
                'The scheduled upstream sync updated `main` to the latest Hermes Agent,',
                'but merging `main` into the `color-hermes` overlay branch hit conflicts.',
                '`main` is up to date; the overlay was left untouched.',
                '',
                'Resolve manually:',
                '',
                '```bash',
                'git fetch origin',
                'git checkout color-hermes',
                'git merge main',
                '# resolve conflicts, then:',
                'git push origin color-hermes',
                '```',
              ].join('\n'),
            });
